[package]
name = "spec"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local spec editor API and runner"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
nix = { version = "0.30", features = ["signal", "process", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
